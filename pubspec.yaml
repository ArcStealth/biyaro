name: biyaro
description: Biyaro - a free, subscription-free motorcycle ride tracker with a rider leaderboard.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  geolocator: ^13.0.2
  geolocator_android: any
  sensors_plus: ^6.1.0
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
