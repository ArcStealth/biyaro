name: Build APK

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: |
          flutter create --platforms=android --org com.arcoco --project-name biyaro .
          git checkout -- lib pubspec.yaml || true
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Unit tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk biyaro-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: biyaro-apk
          path: biyaro-*.apk

      - name: Publish GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: biyaro-*.apk
          prerelease: true
